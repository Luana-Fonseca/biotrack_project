server:
  port: ${PORT:8080}

spring:
  application:
    name: biotrack-api
  datasource:
    # Defaults to the local H2 file used in development. In production (e.g. a Neon/Postgres
    # database), override these four via env vars — nothing else in this file needs to change,
    # and Hibernate auto-detects the SQL dialect from the JDBC driver either way.
    url: ${DB_URL:jdbc:h2:file:./data/biotrack;AUTO_SERVER=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:SA}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      # The H2 console has no auth of its own — must be off whenever the datasource isn't H2
      # (i.e. in production), so it's never reachable on a public deployment.
      enabled: ${H2_CONSOLE_ENABLED:true}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health

biotrack:
  jwt:
    secret: ${JWT_SECRET:biotrack-dev-secret-change-me-biotrack-dev-secret-change-me}
    access-token-minutes: 60
    refresh-token-days: 30
  reports:
    storage-dir: ${REPORTS_DIR:./data/reports}
  cors:
    # Wildcards (matched as origin *patterns*, not exact strings — see SecurityConfig) so a home
    # router handing out a different LAN IP each time (192.168.15.7 one day, .157 the next) doesn't
    # need a new value here every time; any port on common private ranges is allowed.
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://192.168.*.*:*,http://10.*.*.*:*,http://172.16.*.*:*,http://172.17.*.*:*,http://172.18.*.*:*,http://172.19.*.*:*,http://172.20.*.*:*,http://172.21.*.*:*,http://172.22.*.*:*,http://172.23.*.*:*,http://172.24.*.*:*,http://172.25.*.*:*,http://172.26.*.*:*,http://172.27.*.*:*,http://172.28.*.*:*,http://172.29.*.*:*,http://172.30.*.*:*,http://172.31.*.*:*}
  geocoding:
    # Free public Nominatim (OpenStreetMap) instance — no API key needed, but rate-limited and
    # meant for light use per its usage policy (https://operations.osmfoundation.org/policies/nominatim/).
    # If it starts returning HTTP 403, switch to a provider that accepts automated traffic — e.g.
    # LocationIQ (locationiq.com, free tier, no credit card) exposes a Nominatim-compatible /v1/search
    # endpoint. Set GEOCODING_URL=https://us1.locationiq.com/v1/search and GEOCODING_API_KEY to your
    # free key.
    provider-url: ${GEOCODING_URL:https://nominatim.openstreetmap.org/search}
    user-agent: ${GEOCODING_USER_AGENT:BioTrack/1.0 (contato@biotrack.app)}
    api-key: ${GEOCODING_API_KEY:}
  routing:
    # Free public OSRM demo server — same caveat as geocoding above: fine for evaluation/small
    # teams. If unreliable, LocationIQ's directions endpoint is a drop-in alternative:
    # ROUTING_URL=https://us1.locationiq.com/v1/directions/driving plus ROUTING_API_KEY.
    provider-url: ${ROUTING_URL:https://router.project-osrm.org/route/v1/driving}
    api-key: ${ROUTING_API_KEY:}
